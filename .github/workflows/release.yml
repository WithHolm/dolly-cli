name: Release

# A tag that starts with v makes a release on GitHub (see docs/release.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release and its files

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, because this job can write releases. To update, look up the new tag's commit and change both.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the changelog reads the history
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.19.0 # pinned: a release must not change because a new GoReleaser came out
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
