name: Sync Labels
on:
  push:
    branches:
      - main
    paths:
      - '.github/labels.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Label Sync
        uses: MichelBlanchet/github-label-sync-action@v2
        with:
          manifest: '.github/labels.json'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
